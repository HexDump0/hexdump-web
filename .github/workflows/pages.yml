name: Build and deploy Zola website
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          wget -qO- https://github.com/getzola/zola/releases/download/v0.22.0/zola-v0.22.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/

      - name: Install d2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --tala

      - name: Install JetBrains Mono Nerd Font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o /tmp/JetBrainsMono.tar.xz https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
          tar -xJf /tmp/JetBrainsMono.tar.xz -C ~/.local/share/fonts --wildcards 'JetBrainsMonoNerdFont-*.ttf'
          ls ~/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf
          fc-cache -fv

      - name: Install Node dependencies
        run: npm install

      - name: Build site
        run: ./hx build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
